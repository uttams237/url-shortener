# Docker profile — used when running inside Docker Compose
# Connection URLs point to Docker service names (not localhost)

# Database — "postgres" is the Docker Compose service name
spring.datasource.url=jdbc:postgresql://postgres:5432/postgres
spring.datasource.username=uttamsharma
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis — "redis" is the Docker Compose service name
spring.data.redis.host=redis
spring.data.redis.port=6379

# Kafka — "kafka" is the Docker Compose service name
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.uttam.urlshortener.kafka

# JWT
app.jwt.secret=mySecretKeyForJWTTokenGeneration2026UrlShortenerProject123456
app.jwt.expiration-ms=86400000

# Application
server.port=8080
app.base-url=http://localhost:8080/api/v1/urls
