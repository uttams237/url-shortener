# AWS profile — used when deploying to AWS
# Replace placeholder values with your actual AWS resource endpoints

# Database — RDS PostgreSQL
spring.datasource.url=jdbc:postgresql://${RDS_ENDPOINT}:5432/${RDS_DB_NAME}
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis — ElastiCache
spring.data.redis.host=${ELASTICACHE_ENDPOINT}
spring.data.redis.port=6379

# Kafka — running on EC2 (or use SQS as alternative)
spring.kafka.bootstrap-servers=${KAFKA_ENDPOINT}:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.uttam.urlshortener.kafka

# JWT — use a strong secret in production (from AWS Secrets Manager or env var)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Application
server.port=8080
app.base-url=${APP_BASE_URL}
